<!DOCTYPE html>
<html>

<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="hinata_ai">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <title>hinata_ai</title>
  <link rel="manifest" href="manifest.json">

  <!-- Protect customElements.define against duplicate model-viewer element registrations -->
  <script>
    (function () {
      if (typeof customElements !== 'undefined' && customElements.define) {
        var origDefine = customElements.define.bind(customElements);
        customElements.define = function (name, constructor, options) {
          if (customElements.get(name)) {
            console.warn('[ModelViewer Guard] Skipping duplicate registration for custom element:', name);
            return;
          }
          return origDefine(name, constructor, options);
        };
      }
    })();
  </script>
  <!-- Web Speech API Helpers for STT & TTS -->
  <script>
    window.speakText = function (text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel(); // Stop ongoing speech
      var utterance = new SpeechSynthesisUtterance(text);
      utterance.rate = 1.0;
      utterance.pitch = 1.1; // Slightly higher pitch for female voice
      
      // Select best voice (prefer female or Indian English / Telugu if available)
      var voices = window.speechSynthesis.getVoices();
      var selectedVoice = voices.find(v => v.lang.includes('te') || v.lang.includes('in') || v.name.toLowerCase().includes('female') || v.name.toLowerCase().includes('google'));
      if (selectedVoice) utterance.voice = selectedVoice;
      
      window.speechSynthesis.speak(utterance);
    };

    window.startSpeechRecognition = function (onResult, onError) {
      var SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        if (onError) onError('Speech Recognition not supported in this browser');
        return;
      }
      var recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = false;
      recognition.lang = 'te-IN'; // Default to Telugu India recognition, fallback accepts English/Tanglish

      recognition.onresult = function (event) {
        var transcript = event.results[0][0].transcript;
        if (onResult) onResult(transcript);
      };
      recognition.onerror = function (event) {
        if (onError) onError(event.error);
      };
      recognition.start();
    };
  </script>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
</head>

<body>

</html>
