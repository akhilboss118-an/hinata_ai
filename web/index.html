  <!-- Real-time 3D Spider-Man Suit Shader Engine -->
  <script>
    window.currentSpiderSuit = 'stark_enhanced';
    window.applySpiderSuit = function (suitId) {
      window.currentSpiderSuit = suitId || 'stark_enhanced';
      var filterMap = {
        'stark_enhanced': 'none',
        'classic_spidey': 'saturate(165%) contrast(118%) brightness(106%) drop-shadow(0 0 16px rgba(255,77,77,0.45))',
        'symbiote_black': 'grayscale(100%) contrast(165%) brightness(68%) drop-shadow(0 0 20px rgba(255,255,255,0.5))',
        'iron_spider': 'sepia(55%) saturate(190%) contrast(120%) drop-shadow(0 0 20px rgba(255,215,0,0.6))',
        'cyber_2099': 'hue-rotate(160deg) saturate(200%) contrast(130%) drop-shadow(0 0 22px rgba(0,245,212,0.65))'
      };
      var filterVal = filterMap[window.currentSpiderSuit] || 'none';

      // Apply to all model-viewer elements in DOM
      var models = document.querySelectorAll('model-viewer');
      models.forEach(function (m) {
        m.style.filter = filterVal;
        m.style.transition = 'filter 0.5s cubic-bezier(0.4, 0, 0.2, 1)';
      });

      // Apply inside iframes if embedded
      var iframes = document.querySelectorAll('iframe');
      iframes.forEach(function (iframe) {
        try {
          if (iframe.contentDocument) {
            var innerModels = iframe.contentDocument.querySelectorAll('model-viewer');
            innerModels.forEach(function (im) {
              im.style.filter = filterVal;
              im.style.transition = 'filter 0.5s cubic-bezier(0.4, 0, 0.2, 1)';
            });
          }
        } catch (e) {}
      });
    };

    // Auto-apply current suit when new model-viewer elements are added to the DOM
    var observer = new MutationObserver(function (mutations) {
      if (window.currentSpiderSuit && window.currentSpiderSuit !== 'stark_enhanced') {
        window.applySpiderSuit(window.currentSpiderSuit);
      }
    });
    observer.observe(document.documentElement, { childList: true, subtree: true });

  <!-- Web Speech API Helpers for STT & TTS -->
  <script>
    // Ensure voices are loaded asynchronously in Chrome/Safari
    window.speechSynthesis.onvoiceschanged = function() {
      window.speechSynthesis.getVoices();
    };

    // ── HINATA DESKTOP v14 TTS AUDIO ENGINE ──
    var voiceUnlocked = false;
    var availableVoices = [];

    function loadVoices() {
      if ('speechSynthesis' in window) {
        availableVoices = window.speechSynthesis.getVoices() || [];
      }
    }
    if ('speechSynthesis' in window) {
      loadVoices();
      window.speechSynthesis.onvoiceschanged = loadVoices;
    }

    function cleanForSpeechHinata(text) {
      if (!text) return '';
      // Convert ALL-CAPS words to lowercase so TTS reads them as words, not letters
      text = text.replace(/\b([A-Z]{2,})\b/g, function(w) { return w.toLowerCase(); });
      return text
        .replace(/[\u{1F600}-\u{1F64F}\u{1F300}-\u{1F5FF}\u{1F680}-\u{1F6FF}\u{1F700}-\u{1F77F}\u{1F780}-\u{1F7FF}\u{1F800}-\u{1F8FF}\u{1F900}-\u{1F9FF}\u{1FA00}-\u{1FA6F}\u{1FA70}-\u{1FAFF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}]/gu, '')
        .replace(/[♡♥❤✦✧★☆✨⭐~〜]/g, '')
        .replace(/\.\.\./g, ', ')
        .replace(/!{2,}/g, '!').replace(/\?{2,}/g, '?')
        .replace(/[<>\/\\]/g, '')
        .replace(/\baiyyo\b/gi, 'ayyo')
        .replace(/\bna\?/gi, 'na?')
        .replace(/\bno\?\s*/gi, 'right? ')
        .replace(/\bna\b/gi, '')
        .replace(/\bonly\b/gi, '')
        .replace(/\bhaha+\b/gi, 'haha')
        .replace(/\bheheee+\b/gi, 'heh heh')
        .replace(/\bbaneee+\b/gi, 'banay')
        .replace(/\bchupp\s*normuyy\b/gi, 'chup normuy')
        .replace(/\bushh+\b/gi, 'ush')
        .replace(/\s{2,}/g, ' ')
        .trim();
    }

    function pickBestVoice() {
      var voices = availableVoices.length ? availableVoices : (window.speechSynthesis ? window.speechSynthesis.getVoices() : []);
      var preferred = [
        'Google తెలుగు', 'Google Telugu', 'Microsoft Heera Online Natural', 'Microsoft Heera',
        'Lekha', 'Rishi', 'Google हिन्दी',
        'Google UK English Female', 'Samantha', 'Karen', 'Moira',
        'Microsoft Aria Online Natural', 'Microsoft Aria', 'Microsoft Jenny', 'Zira', 'Tessa', 'Victoria'
      ];
      for (var i = 0; i < preferred.length; i++) {
        var v = voices.find(function(item) { return item.name.toLowerCase().includes(preferred[i].toLowerCase()); });
        if (v) return v;
      }
      return voices.find(function(v) { return /en[-_](IN|GB|AU|US)/i.test(v.lang); }) ||
             voices.find(function(v) { return /en/i.test(v.lang); }) ||
             voices[0] || null;
    }

    function splitIntoChunks(text) {
      var raw = text.match(/[^.!?]{1,100}[.!?]?/g) || [text];
      return raw.map(function(s) { return s.trim(); }).filter(function(s) { return s.length > 1; });
    }

    window.isVoiceMuted = false;

    window.currentAudioElement = null;

    window.playAudioBase64 = function (base64Data, onEnd) {
      if (window.isVoiceMuted) {
        if (onEnd) onEnd();
        return;
      }
      window.stopAllSpeech();

      try {
        var audio = new Audio('data:audio/mpeg;base64,' + base64Data);
        window.currentAudioElement = audio;
        audio.onended = function () {
          window.currentAudioElement = null;
          if (onEnd) onEnd();
        };
        audio.onerror = function () {
          window.currentAudioElement = null;
          if (onEnd) onEnd();
        };
        audio.play().catch(function(e) {
          console.warn('Audio autoplay blocked or failed:', e);
          if (onEnd) onEnd();
        });
      } catch (err) {
        console.error('Audio playback error:', err);
        if (onEnd) onEnd();
      }
    };

    window.speakSpiderMan = function (text, pitch, rate, onEnd) {
      if (!('speechSynthesis' in window) || window.isVoiceMuted) {
        if (typeof onEnd === 'function') onEnd();
        else if (typeof pitch === 'function') pitch();
        return;
      }
      window.stopAllSpeech();

      var cleaned = cleanForSpeechHinata(text);
      if (!cleaned) {
        if (typeof onEnd === 'function') onEnd();
        else if (typeof pitch === 'function') pitch();
        return;
      }

      // Handle backward-compatible argument signatures
      var actualEnd = null;
      var actualPitch = 1.22;
      var actualRate = 1.12;

      if (typeof pitch === 'function') {
        actualEnd = pitch;
      } else if (typeof rate === 'function') {
        actualEnd = rate;
        if (typeof pitch === 'number') actualPitch = pitch;
      } else {
        if (typeof pitch === 'number') actualPitch = pitch;
        if (typeof rate === 'number') actualRate = rate;
        if (typeof onEnd === 'function') actualEnd = onEnd;
      }

      var voices = availableVoices.length ? availableVoices : (window.speechSynthesis ? window.speechSynthesis.getVoices() : []);
      // Look for young energetic male voices
      var spideyVoice = voices.find(function(v) { return /David|Alex|Daniel|Guy|James|en[-_]US/i.test(v.name); }) ||
                        voices.find(function(v) { return /male/i.test(v.name); }) ||
                        voices.find(function(v) { return /en[-_]US/i.test(v.lang); }) ||
                        voices[0];

      var u = new SpeechSynthesisUtterance(cleaned);
      u.pitch = actualPitch; // Emotion-modulated Peter Parker pitch
      u.rate = actualRate;   // Emotion-modulated delivery pace
      u.volume = 1.0;
      if (spideyVoice) {
        u.voice = spideyVoice;
      }
      u.onend = function () {
        if (actualEnd) actualEnd();
      };
      u.onerror = function () {
        if (actualEnd) actualEnd();
      };
      window.speechSynthesis.speak(u);
    };

    window.stopAllSpeech = function () {
      if (window.currentAudioElement) {
        window.currentAudioElement.pause();
        window.currentAudioElement.currentTime = 0;
        window.currentAudioElement = null;
      }
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
    };

    window.activeSpeechRecognition = null;
    window.isHinataListening = false;

    window.hinataSpeech = {
      hasSupport: function() {
        return !!(window.SpeechRecognition || window.webkitSpeechRecognition);
      }
    };

    window.startHinataSpeech = function(onResult, onError, onStateChange) {
      var SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRec) {
        if (onError) onError('Speech recognition is not supported in this browser. Please use text input.');
        return false;
      }

      // Stop previous instance if active
      if (window.activeSpeechRecognition) {
        try {
          window.activeSpeechRecognition.abort();
        } catch(e) {}
        window.activeSpeechRecognition = null;
      }

      try {
        var recognition = new SpeechRec();
        window.activeSpeechRecognition = recognition;
        window.isHinataListening = true;

        recognition.continuous = true;
        recognition.interimResults = true;
        recognition.maxAlternatives = 1;

        // Auto-detect browser/user preferred language or default to en-US/en-IN
        var lang = (navigator.languages && navigator.languages[0]) || navigator.language || 'en-US';
        recognition.lang = lang;

        var fullTranscript = '';
        var silenceTimer = null;

        recognition.onstart = function() {
          window.isHinataListening = true;
          if (onStateChange) onStateChange(true);
        };

        recognition.onresult = function(event) {
          var interimTranscript = '';
          for (var i = event.resultIndex; i < event.results.length; ++i) {
            if (event.results[i].isFinal) {
              fullTranscript += event.results[i][0].transcript + ' ';
            } else {
              interimTranscript += event.results[i][0].transcript;
            }
          }
          var current = (fullTranscript + interimTranscript).trim();
          if (current.length > 0 && onResult) {
            onResult(current);
          }

          // Auto-stop after 1.8 seconds of silence when user finishes speaking
          if (silenceTimer) clearTimeout(silenceTimer);
          silenceTimer = setTimeout(function() {
            if (window.activeSpeechRecognition && window.isHinataListening && current.length > 0) {
              try {
                window.activeSpeechRecognition.stop();
              } catch(e) {}
            }
          }, 1800);
        };

        recognition.onerror = function(event) {
          if (silenceTimer) clearTimeout(silenceTimer);
          var errType = event.error || 'unknown';

          if (errType === 'no-speech' || errType === 'aborted') {
            return; // Ignore silence or user stop
          }

          window.isHinataListening = false;
          if (onStateChange) onStateChange(false);
          window.activeSpeechRecognition = null;

          var userFriendlyMsg = 'Speech error: ' + errType;
          if (errType === 'not-allowed' || errType === 'service-not-allowed') {
            userFriendlyMsg = 'Microphone permission denied. Please allow microphone access in browser settings.';
          } else if (errType === 'audio-capture') {
            userFriendlyMsg = 'No microphone was found or microphone is busy.';
          } else if (errType === 'network') {
            userFriendlyMsg = 'Speech service network error. Please check your internet.';
          }

          if (onError) onError(userFriendlyMsg);
        };

        recognition.onend = function() {
          if (silenceTimer) clearTimeout(silenceTimer);
          window.isHinataListening = false;
          if (onStateChange) onStateChange(false);
          window.activeSpeechRecognition = null;
        };

        recognition.start();
        return true;
      } catch (err) {
        window.isHinataListening = false;
        window.activeSpeechRecognition = null;
        if (onStateChange) onStateChange(false);
        if (onError) onError('Could not initialize microphone: ' + err);
        return false;
      }
    };

    window.stopHinataSpeech = function() {
      window.isHinataListening = false;
      if (window.activeSpeechRecognition) {
        try {
          window.activeSpeechRecognition.stop();
        } catch(e) {
          try { window.activeSpeechRecognition.abort(); } catch(_) {}
        }
        window.activeSpeechRecognition = null;
      }
    };

    // Backward-compatibility wrapper
    window.startSpeechRecognition = function(onResult, onError) {
      return window.startHinataSpeech(onResult, onError, null);
    };
  </script>
  <!-- Superhero Web Audio FX Synthesizer (Zero asset dependency) -->
  <script>
    (function() {
      var audioCtx = null;
      function getAudioContext() {
        if (!audioCtx) {
          var AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) {
            audioCtx = new AudioContext();
          }
        }
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        return audioCtx;
      }

      window.playHeroSound = function(type) {
        try {
          var ctx = getAudioContext();
          if (!ctx) return;
          var t = ctx.currentTime;

          if (type === 'thwip') {
            // Authentic pneumatic web-shoot 'THWIP!'
            var osc = ctx.createOscillator();
            var gain = ctx.createGain();
            var filter = ctx.createBiquadFilter();

            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(1600, t);
            osc.frequency.exponentialRampToValueAtTime(180, t + 0.11);

            filter.type = 'bandpass';
            filter.frequency.setValueAtTime(2200, t);
            filter.frequency.exponentialRampToValueAtTime(600, t + 0.11);
            filter.Q.setValueAtTime(3.0, t);

            gain.gain.setValueAtTime(0.35, t);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.11);

            // White noise burst for air puff
            var bufferSize = ctx.sampleRate * 0.08;
            var noiseBuffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
            var output = noiseBuffer.getChannelData(0);
            for (var i = 0; i < bufferSize; i++) {
              output[i] = Math.random() * 2 - 1;
            }
            var whiteNoise = ctx.createBufferSource();
            whiteNoise.buffer = noiseBuffer;
            var noiseGain = ctx.createGain();
            noiseGain.gain.setValueAtTime(0.2, t);
            noiseGain.gain.exponentialRampToValueAtTime(0.001, t + 0.08);

            osc.connect(filter);
            filter.connect(gain);
            gain.connect(ctx.destination);
            whiteNoise.connect(noiseGain);
            noiseGain.connect(ctx.destination);

            osc.start(t);
            osc.stop(t + 0.12);
            whiteNoise.start(t);
            whiteNoise.stop(t + 0.08);

          } else if (type === 'spider_sense') {
            // Harmonic vibrating Spider-Sense pulse
            var osc1 = ctx.createOscillator();
            var osc2 = ctx.createOscillator();
            var gain = ctx.createGain();

            osc1.type = 'sine';
            osc2.type = 'triangle';
            osc1.frequency.setValueAtTime(660, t);
            osc1.frequency.setValueAtTime(880, t + 0.08);
            osc1.frequency.setValueAtTime(1100, t + 0.16);
            osc2.frequency.setValueAtTime(330, t);

            gain.gain.setValueAtTime(0.22, t);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.28);

            osc1.connect(gain);
            osc2.connect(gain);
            gain.connect(ctx.destination);

            osc1.start(t);
            osc1.stop(t + 0.30);
            osc2.start(t);
            osc2.stop(t + 0.30);

          } else if (type === 'nanotech_equip') {
            // Holographic power-up sweep
            var freqs = [350, 520, 700, 1040];
            freqs.forEach(function(f, idx) {
              var osc = ctx.createOscillator();
              var gain = ctx.createGain();
              var startTime = t + (idx * 0.06);

              osc.type = 'sine';
              osc.frequency.setValueAtTime(f, startTime);
              osc.frequency.exponentialRampToValueAtTime(f * 1.5, startTime + 0.18);

              gain.gain.setValueAtTime(0.18, startTime);
              gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.18);

              osc.connect(gain);
              gain.connect(ctx.destination);
              osc.start(startTime);
              osc.stop(startTime + 0.20);
            });

          } else if (type === 'tap_chime') {
            // Subtle tactile high-tech pop
            var osc = ctx.createOscillator();
            var gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(920, t);
            osc.frequency.exponentialRampToValueAtTime(340, t + 0.06);
            gain.gain.setValueAtTime(0.18, t);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.06);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(t);
            osc.stop(t + 0.07);

          } else if (type === 'whoosh') {
            // Aerodynamic web-swing whoosh
            var osc = ctx.createOscillator();
            var gain = ctx.createGain();
            var filter = ctx.createBiquadFilter();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(140, t);
            osc.frequency.linearRampToValueAtTime(420, t + 0.12);
            osc.frequency.linearRampToValueAtTime(90, t + 0.25);
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(800, t);
            gain.gain.setValueAtTime(0.25, t);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
            osc.connect(filter);
            filter.connect(gain);
            gain.connect(ctx.destination);
            osc.start(t);
            osc.stop(t + 0.26);
          }
        } catch (e) {
          console.log('Audio FX notice: ', e);
        }
      };
    })();
