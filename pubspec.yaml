name: hinata_ai
description: "Hinata AI - A persistent 3D AI Companion with Firebase, Gemini AI, and Stitch UI"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Firebase Ecosystem
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.0.1
  google_sign_in: ^6.2.1

  # AI Intelligence (Gemini Structured Outputs)
  google_generative_ai: ^0.4.5

  # 3D Model Rendering Viewport
  model_viewer_plus: ^1.8.0
  video_player: ^2.8.6

  # UI Design Tokens & Animations
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  intl: ^0.19.0
  shared_preferences: ^2.2.3
  uuid: ^4.4.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/models/standing_idle.glb
    - assets/models/waving_gesture.glb
    - assets/models/clapping.glb
    - assets/models/sad_idle.glb
    - assets/models/
    - assets/videos/
    - assets/images/
    - assets/icons/
